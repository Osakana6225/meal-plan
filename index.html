<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>今週の節約献立（2人分）6/29〜7/5</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif; background: #f5f3ee; color: #2e2a24; line-height: 1.7; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 20px 16px 60px; }
  header { text-align: center; padding: 28px 16px; background: linear-gradient(135deg,#e8825b,#d96846); color:#fff; border-radius: 18px; margin-bottom: 22px; box-shadow:0 6px 18px rgba(217,104,70,.25); }
  header h1 { font-size: 1.6rem; letter-spacing:.02em; }
  header p { margin-top: 6px; font-size:.95rem; opacity:.95; }
  .budget { display:inline-block; margin-top:12px; background:rgba(255,255,255,.22); padding:6px 16px; border-radius:999px; font-weight:700; font-size:.95rem; }
  .tabs { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:20px; }
  .tab { border:none; background:#fff; color:#7a6f5f; padding:9px 14px; border-radius:12px; font-size:.92rem; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.06); transition:.15s; font-weight:600; }
  .tab:hover { transform:translateY(-1px); }
  .tab.active { background:#d96846; color:#fff; }
  .card { background:#fff; border-radius:18px; padding:22px; box-shadow:0 4px 16px rgba(0,0,0,.07); }
  .day-head { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; border-bottom:2px dashed #ecdfce; padding-bottom:12px; margin-bottom:16px; }
  .day-head h2 { font-size:1.35rem; color:#d96846; }
  .day-head .date { color:#a99; font-size:.95rem; }
  .meta { margin-left:auto; display:flex; gap:8px; }
  .pill { background:#f3ece0; color:#8a7a62; padding:4px 12px; border-radius:999px; font-size:.82rem; font-weight:700; }
  .menu-row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px; }
  .menu-item { background:#faf6ee; border-radius:12px; padding:12px; text-align:center; }
  .menu-item .label { font-size:.72rem; color:#b3a48c; font-weight:700; letter-spacing:.08em; }
  .menu-item .name { font-size:.98rem; font-weight:700; margin-top:4px; }
  .desc { background:#fff7f3; border-left:4px solid #e8825b; padding:10px 14px; border-radius:8px; font-size:.92rem; color:#6b5d4a; margin-bottom:18px; }
  .sec { margin-bottom:16px; }
  .sec h3 { font-size:.98rem; color:#c2562f; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
  .ing { display:grid; grid-template-columns:repeat(2,1fr); gap:4px 18px; }
  .ing div { font-size:.9rem; border-bottom:1px dotted #eee; padding:3px 0; }
  ol.steps { padding-left:20px; }
  ol.steps li { font-size:.92rem; margin-bottom:6px; }
  .twocol { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .note { border-radius:10px; padding:12px 14px; font-size:.88rem; }
  .nutri { background:#eef6ec; border-left:4px solid #6fae5d; color:#456b3a; }
  .tip { background:#fef6e3; border-left:4px solid #e0a93c; color:#8a6a1f; }
  .shop .card { padding:22px; }
  .shop-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
  .shop-cat h4 { color:#c2562f; font-size:1rem; margin-bottom:8px; border-bottom:2px solid #f0e3d2; padding-bottom:4px; }
  .shop-cat ul { list-style:none; }
  .shop-cat li { font-size:.9rem; padding:4px 0; border-bottom:1px dotted #eee; display:flex; justify-content:space-between; }
  .shop-cat li span { color:#a99; }
  footer { text-align:center; margin-top:26px; color:#b3a48c; font-size:.82rem; }
  @media (max-width:600px){ .menu-row{grid-template-columns:1fr;} .ing{grid-template-columns:1fr;} .twocol{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;

const days = [
  {
    day:"月曜日", date:"6/29",
    main:"豚こまと玉ねぎのオイスター炒め", sub:"もやしのナムル", soup:"わかめスープ",
    time:"20分", cost:"約450円",
    mainDesc:"特売の豚こまをオイスターソースでコク旨に。ごはんが進む中華風の炒めもの",
    ing:["豚こま切れ肉 250g","玉ねぎ 1個","ピーマン 2個","オイスターソース 大さじ1.5","醤油 小さじ1","酒・砂糖 各小さじ1","おろしにんにく 少々","【副菜】もやし 1袋","ごま油・鶏がら 各小さじ1","【汁】乾燥わかめ 大さじ1","鶏がらスープの素 小さじ1"],
    steps:["玉ねぎはくし切り、ピーマンは細切り、豚こまは食べやすく切る","フライパンで豚肉を炒め、色が変わったら玉ねぎ・ピーマンを加える","合わせ調味料を回し入れて手早く炒め絡める","もやしをさっとゆで、ごま油・鶏がら・すりごまで和えてナムルに。わかめスープを添える"],
    nutri:"豚肉のビタミンB1で疲労回復。玉ねぎのアリシンが吸収を助けます",
    tip:"豚肉に薄く片栗粉をまぶしてから炒めると、たれが絡んでパサつきません"
  },
  {
    day:"火曜日", date:"6/30",
    main:"鶏むね肉のピカタ", sub:"キャベツの塩昆布和え", soup:"トマトと卵のスープ",
    time:"25分", cost:"約430円",
    mainDesc:"安い鶏むねを卵液でふんわりコーティング。粉チーズ入りの衣で満足感アップ",
    ing:["鶏むね肉 1枚(300g)","卵 1個","粉チーズ 大さじ1","小麦粉 適量","塩こしょう 少々","オリーブ油 大さじ1","【副菜】キャベツ 1/4個","塩昆布 ひとつまみ","ごま油 小さじ1","【汁】トマト 1個","卵 1個","コンソメ 小さじ1"],
    steps:["鶏むねはそぎ切りにして塩こしょうし、小麦粉をまぶす","卵に粉チーズを混ぜ、肉をくぐらせて油で両面焼く","ちぎったキャベツを塩昆布とごま油で和える","トマトを煮てコンソメで味付けし、溶き卵を流してスープに"],
    nutri:"鶏むねの高たんぱく低脂質。卵とチーズでカルシウムとビタミンも補給",
    tip:"そぎ切りで火の通りが早くなり、むね肉でもしっとり柔らかく仕上がります"
  },
  {
    day:"水曜日", date:"7/1",
    main:"さばの味噌煮", sub:"きゅうりとちくわの酢の物", soup:"なめこの味噌汁",
    time:"25分", cost:"約460円",
    mainDesc:"生さばの切り身を甘めの味噌だれでこっくり煮込む和の定番。ごはんが進む一皿",
    ing:["生さば 2切れ","しょうが 1かけ","味噌 大さじ1.5","砂糖・酒・みりん 各大さじ1","水 100ml","【副菜】きゅうり 1本","ちくわ 1本","酢・砂糖 各小さじ2","【汁】なめこ 1袋","だし汁 400ml","味噌 大さじ1.5"],
    steps:["さばは皮目に切れ込みを入れ、熱湯をかけて霜降りにする","鍋に調味料と薄切りしょうがを煮立て、さばを並べて落とし蓋で10分煮る","薄切りきゅうりと斜め切りちくわを甘酢で和える","なめこを煮て味噌を溶き、汁物を仕上げる"],
    nutri:"青魚のDHA・EPAで血流サポート。なめこの食物繊維で腸内環境も整えます",
    tip:"霜降りで臭みを取ると、安い生さばでも上品な味噌煮に仕上がります"
  },
  {
    day:"木曜日", date:"7/2",
    main:"厚揚げと豚肉のスタミナ炒め", sub:"ほうれん草のおひたし", soup:"豆腐とねぎの中華スープ",
    time:"20分", cost:"約420円",
    mainDesc:"厚揚げでかさ増しして節約&食べごたえ満点。にんにく醤油だれでスタミナ補給",
    ing:["厚揚げ 1枚","豚こま切れ肉 150g","にら 1/2束","おろしにんにく 小さじ1","醤油・みりん 各大さじ1","オイスターソース 小さじ1","【副菜】ほうれん草 1/2束","醤油・かつお節 適量","【汁】絹豆腐 1/2丁","長ねぎ 1/4本","鶏がらスープの素 小さじ1"],
    steps:["厚揚げは一口大、にらは4cm幅に切る","フライパンで豚肉を炒め、厚揚げを加えて焼き色をつける","合わせだれとにらを入れて手早く炒め絡める","ほうれん草をゆでて醤油とかつお節で和え、豆腐とねぎの中華スープを添える"],
    nutri:"厚揚げの植物性たんぱくと豚肉の動物性たんぱくをダブルで。にらでスタミナ強化",
    tip:"厚揚げは熱湯をかけて油抜きすると、味がよく染み込みます"
  },
  {
    day:"金曜日", date:"7/3",
    main:"三色そぼろ丼", sub:"ブロッコリーのおかか和え", soup:"麩とねぎのすまし汁",
    time:"20分", cost:"約400円",
    mainDesc:"鶏ひき肉・炒り卵・青菜の彩り丼。フライパンひとつでできる節約ワンボウル",
    ing:["鶏ひき肉 200g","卵 2個","さやいんげん 6本","醤油・砂糖・みりん 各大さじ1","ごはん 2杯分","【副菜】ブロッコリー 1/2株","かつお節・醤油 適量","【汁】麩 6個","長ねぎ 少々","だし汁 400ml"],
    steps:["鶏ひき肉を調味料で炒り、汁気がなくなるまで火を通す","卵に砂糖少々を加え、菜箸数本で炒り卵を作る","いんげんは塩ゆでして斜め切りにする","ごはんに三色をのせ、ブロッコリーのおかか和えとすまし汁を添える"],
    nutri:"鶏ひき肉と卵の良質たんぱく、緑黄色野菜でビタミンと彩りもしっかり",
    tip:"そぼろは火を止める直前に味をみて調整すると、冷めても味がぼやけません"
  },
  {
    day:"土曜日", date:"7/4",
    main:"野菜たっぷりポークカレー", sub:"水菜とコーンのサラダ", soup:"福神漬け添え",
    time:"40分", cost:"約560円",
    mainDesc:"週末は大鍋カレーでお得に。豚こまと根菜で食べごたえ十分、翌日も楽しめる",
    ing:["豚こま切れ肉 200g","玉ねぎ 2個","にんじん 1本","じゃがいも 2個","カレールウ 1/2箱","水 600ml","サラダ油 大さじ1","【副菜】水菜 1/2束","コーン 大さじ3","ドレッシング 適量","福神漬け 適量"],
    steps:["野菜を一口大に切り、豚肉と一緒に油で炒める","水を加えてアクを取りながら15分煮込む","火を止めてルウを溶かし、とろみがつくまで弱火で煮る","水菜とコーンのサラダ、福神漬けを添えて盛り付ける"],
    nutri:"根菜のビタミン・食物繊維と豚肉のたんぱく質。一皿で栄養バランス良好",
    tip:"ルウは必ず火を止めてから加えると、ダマにならず均一に溶けます"
  },
  {
    day:"日曜日", date:"7/5",
    main:"鶏もも肉のトマト煮込み", sub:"粉ふきいも", soup:"オニオンコンソメスープ",
    time:"35分", cost:"約520円",
    mainDesc:"週末締めは少しごちそう感のある洋風煮込み。トマト缶で手軽に本格的な味わい",
    ing:["鶏もも肉 250g","玉ねぎ 1個","しめじ 1/2株","カットトマト缶 1/2缶","コンソメ 小さじ1","にんにく 1かけ","オリーブ油 大さじ1","塩こしょう 少々","【副菜】じゃがいも 2個","【汁】玉ねぎ 1/2個","コンソメ 小さじ1"],
    steps:["鶏ももは一口大に塩こしょうし、にんにくと油で皮目から焼く","玉ねぎとしめじを加えて炒め、トマト缶とコンソメを入れる","蓋をして弱火で15分煮込み、塩こしょうで味を調える","じゃがいもをゆでて粉ふきいもに。玉ねぎのコンソメスープを添える"],
    nutri:"トマトのリコピンで抗酸化、鶏ももの旨みとたんぱく質でしっかり満足",
    tip:"皮目をしっかり焼いてから煮ると、香ばしさとコクが加わります"
  }
];

const shopping = {
  "肉・魚":[["豚こま切れ肉","約600g"],["鶏むね肉","1枚"],["鶏もも肉","250g"],["鶏ひき肉","200g"],["生さば","2切れ"]],
  "野菜":[["玉ねぎ","5個"],["にんじん","1本"],["じゃがいも","4個"],["ピーマン","2個"],["キャベツ","1/4個"],["きゅうり","1本"],["にら","1/2束"],["ほうれん草","1/2束"],["さやいんげん","6本"],["ブロッコリー","1/2株"],["水菜","1/2束"],["しめじ・なめこ","各1袋"],["長ねぎ・しょうが","各少々"]],
  "豆腐・大豆製品":[["厚揚げ","1枚"],["絹豆腐","1/2丁"],["ちくわ","1本"]],
  "卵・乳":[["卵","6個"],["粉チーズ","少量"]],
  "缶詰・乾物":[["カットトマト缶","1/2缶"],["コーン","1缶"],["乾燥わかめ・麩","各少量"],["塩昆布","少量"]],
  "調味料・その他":[["カレールウ","1/2箱"],["オイスターソース","少量"],["味噌・醤油・みりん","常備"],["福神漬け","適量"],["ごはん用米","適量"]]
};

function Card({d}){
  return (
    <div className="card">
      <div className="day-head">
        <h2>{d.day}</h2><span className="date">{d.date}</span>
        <div className="meta"><span className="pill">⏱ {d.time}</span><span className="pill">💰 {d.cost}</span></div>
      </div>
      <div className="menu-row">
        <div className="menu-item"><div className="label">メイン</div><div className="name">{d.main}</div></div>
        <div className="menu-item"><div className="label">副菜</div><div className="name">{d.sub}</div></div>
        <div className="menu-item"><div className="label">汁物</div><div className="name">{d.soup}</div></div>
      </div>
      <div className="desc">{d.mainDesc}</div>
      <div className="sec"><h3>🛒 材料（2人分）</h3>
        <div className="ing">{d.ing.map((x,i)=><div key={i}>{x}</div>)}</div>
      </div>
      <div className="sec"><h3>👩‍🍳 作り方</h3>
        <ol className="steps">{d.steps.map((x,i)=><li key={i}>{x}</li>)}</ol>
      </div>
      <div className="twocol">
        <div className="note nutri"><strong>🥗 栄養ポイント</strong><br/>{d.nutri}</div>
        <div className="note tip"><strong>💡 コツ</strong><br/>{d.tip}</div>
      </div>
    </div>
  );
}

function App(){
  const [tab,setTab] = useState(0);
  return (
    <div className="wrap">
      <header>
        <h1>今週の節約献立 🍚</h1>
        <p>2人分・夕食 ／ 6月29日(月)〜7月5日(日)</p>
        <div className="budget">週合計 約3,240円（買い物リスト目安）</div>
      </header>
      <div className="tabs">
        {days.map((d,i)=>(
          <button key={i} className={"tab"+(tab===i?" active":"")} onClick={()=>setTab(i)}>{d.day.slice(0,1)}<small> {d.date}</small></button>
        ))}
        <button className={"tab"+(tab===7?" active":"")} onClick={()=>setTab(7)}>🛒 買い物</button>
      </div>
      {tab<7 ? <Card d={days[tab]} /> : (
        <div className="shop card">
          <div className="day-head"><h2>買い物リスト</h2><span className="date">1週間分・2人</span></div>
          <div className="shop-grid">
            {Object.entries(shopping).map(([cat,items])=>(
              <div className="shop-cat" key={cat}>
                <h4>{cat}</h4>
                <ul>{items.map((it,i)=><li key={i}>{it[0]}<span>{it[1]}</span></li>)}</ul>
              </div>
            ))}
          </div>
        </div>
      )}
      <footer>節約重視・週合計 約3,000〜3,500円目安 ／ 毎週日曜に自動更新</footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
