          {Object.entries(shoppingList).map(([cat, items]) => (
            <div key={cat} style={{ marginBottom: 16 }}>
              <h3 style={{ fontSize: 14, fontWeight: 600, color: "#667eea", marginBottom: 8, borderBottom: "2px solid #e2e8f0", paddingBottom: 4 }}>{cat}</h3>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                {items.map((item, j) => (
                  <span key={j} style={{ background: "#f7fafc", border: "1px solid #e2e8f0", borderRadius: 8, padding: "4px 10px", fontSize: 13, color: "#4a5568" }}>{item}</span>
                ))}
              </div>
            </div>
          ))}
        </div>
      ) : (
        /* Daily Menu */
        <div style={{ background: "#fff", borderRadius: 16, padding: 20, boxShadow: "0 2px 12px rgba(0,0,0,0.08)" }}>
          {/* Menu Summary */}
          <div style={{ marginBottom: 16 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
              <h2 style={{ fontSize: 20, fontWeight: 700, color: "#2d3748" }}>{meal.main}</h2>
              <div style={{ display: "flex", gap: 8 }}>
                <span style={{ background: "#ebf4ff", color: "#4299e1", padding: "3px 10px", borderRadius: 20, fontSize: 12, fontWeight: 600 }}>⏱ {meal.time}</span>
                <span style={{ background: "#f0fff4", color: "#48bb78", padding: "3px 10px", borderRadius: 20, fontSize: 12, fontWeight: 600 }}>💰 {meal.cost}</span>
              </div>
            </div>
            <p style={{ fontSize: 13, color: "#718096", marginBottom: 8 }}>{meal.mainDesc}</p>
            <div style={{ display: "flex", gap: 12, fontSize: 13, color: "#4a5568" }}>
              <span>📌 副菜: {meal.side}</span>
              <span>🍲 汁物: {meal.soup}</span>
            </div>
          </div>

          {/* Tip */}
          <div style={{ background: "#fffaf0", border: "1px solid #feebc8", borderRadius: 12, padding: "10px 14px", marginBottom: 16, fontSize: 13, color: "#975a16" }}>
            💡 {meal.tip}
          </div>

          {/* Expandable Sections */}
          {[
            { key: "main", label: `🥩 ${meal.main}`, detail: meal.mainDetail },
            { key: "side", label: `🥗 ${meal.side}`, detail: meal.sideDetail },
            { key: "soup", label: `🍲 ${meal.soup}`, detail: meal.soupDetail }
          ].map(({ key, label, detail }) => (
            <div key={key} style={{ marginBottom: 10 }}>
              <button onClick={() => toggleSection(key)}
                style={{
                  width: "100%", padding: "12px 16px", borderRadius: 12,
                  border: "1px solid #e2e8f0", background: expandedSection === key ? "#f7fafc" : "#fff",
                  cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center",
                  fontSize: 14, fontWeight: 600, color: "#2d3748"
                }}>
                {label}
                <span style={{ transform: expandedSection === key ? "rotate(180deg)" : "rotate(0deg)", transition: "transform 0.2s" }}>▼</span>
              </button>
              {expandedSection === key && (
                <div style={{ padding: "12px 16px", borderLeft: "3px solid #667eea", marginLeft: 8, marginTop: 4 }}>
                  <div style={{ marginBottom: 12 }}>
                    <h4 style={{ fontSize: 13, fontWeight: 600, color: "#667eea", marginBottom: 6 }}>材料（2人分）</h4>
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 4 }}>
                      {detail.ingredients.map((ing, k) => (
                        <span key={k} style={{ background: "#edf2f7", borderRadius: 6, padding: "3px 8px", fontSize: 12, color: "#4a5568" }}>{ing}</span>
                      ))}
                    </div>
                  </div>
                  <div>
                    <h4 style={{ fontSize: 13, fontWeight: 600, color: "#667eea", marginBottom: 6 }}>作り方</h4>
                    {detail.steps.map((step, k) => (
                      <div key={k} style={{ display: "flex", gap: 8, marginBottom: 6, fontSize: 13, color: "#4a5568" }}>
                        <span style={{ background: "#667eea", color: "#fff", borderRadius: "50%", width: 22, height: 22, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontWeight: 700, flexShrink: 0 }}>{k + 1}</span>
                        <span style={{ lineHeight: 1.5 }}>{step}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          ))}

          {/* Nutrition */}
          <div style={{ background: "#f0fff4", border: "1px solid #c6f6d5", borderRadius: 12, padding: "10px 14px", marginTop: 12, fontSize: 13, color: "#276749" }}>
            🥦 栄養ポイント: {meal.nutrition}
          </div>
        </div>
      )}

      {/* Footer */}
      <p style={{ textAlign: "center", fontSize: 11, color: "#a0aec0", marginTop: 16 }}>
        自動生成 by Claude ・ 毎週日曜更新
      </p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
