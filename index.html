            {meal.steps.map((step,i) => (
              <div key={i} style={{display:'flex',gap:'12px',marginBottom:'12px',alignItems:'flex-start'}}>
                <div style={{flexShrink:0,width:'28px',height:'28px',borderRadius:'50%',background:DAY_COLORS[selected],color:'white',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:'bold',fontSize:'13px'}}>{i+1}</div>
                <p style={{fontSize:'14px',color:'#4a5568',lineHeight:'1.7',paddingTop:'3px'}}>{step}</p>
              </div>
            ))}
          </div>

          {/* Nutrition & Tip */}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px'}}>
            <div style={{background:'#f0fff4',borderRadius:'12px',padding:'16px',border:'1px solid #9ae6b4'}}>
              <h4 style={{fontSize:'13px',fontWeight:'bold',color:'#276749',marginBottom:'8px'}}>🥦 栄養ポイント</h4>
              <p style={{fontSize:'12px',color:'#276749',lineHeight:'1.6'}}>{meal.nutrition}</p>
            </div>
            <div style={{background:'#fffaf0',borderRadius:'12px',padding:'16px',border:'1px solid #fbd38d'}}>
              <h4 style={{fontSize:'13px',fontWeight:'bold',color:'#744210',marginBottom:'8px'}}>💡 調理のコツ</h4>
              <p style={{fontSize:'12px',color:'#744210',lineHeight:'1.6'}}>{meal.tip}</p>
            </div>
          </div>
        </div>
      )}

      {tab === 'shop' && (
        <div style={{background:'white',borderRadius:'16px',padding:'20px',boxShadow:'0 2px 12px rgba(0,0,0,0.08)'}}>
          <h3 style={{fontSize:'18px',fontWeight:'bold',marginBottom:'20px',color:'#2d3748'}}>🛒 週間買い物リスト</h3>
          <div style={{background:'#ebf8ff',borderRadius:'10px',padding:'12px',marginBottom:'16px',fontSize:'13px',color:'#2b6cb0'}}>
            💰 週合計予算：{TOTAL_BUDGET}（2人分・夕食のみ）
          </div>
          {Object.entries(shoppingList).map(([cat, items]) => (
            <div key={cat} style={{marginBottom:'20px'}}>
              <h4 style={{fontSize:'14px',fontWeight:'bold',color:'#4a5568',marginBottom:'10px',paddingBottom:'6px',borderBottom:'2px solid #e2e8f0'}}>
                {cat}
              </h4>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'6px'}}>
                {items.map((item,i) => (
                  <label key={i} style={{display:'flex',alignItems:'flex-start',gap:'8px',cursor:'pointer',fontSize:'13px',color:'#4a5568',lineHeight:'1.5'}}>
                    <input type="checkbox" style={{marginTop:'2px',flexShrink:0}} />
                    {item}
                  </label>
                ))}
              </div>
            </div>
          ))}
          <div style={{background:'#f7fafc',borderRadius:'10px',padding:'12px',marginTop:'8px',fontSize:'12px',color:'#718096'}}>
            ※ 醤油・みりん・砂糖・酒・油などの基本調味料は含みません
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
