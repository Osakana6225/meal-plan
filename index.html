                    <li key={i} style={{ fontSize: "12px", padding: "3px 0", display: "flex", alignItems: "center", gap: "6px" }}>
                      <span style={{ color: "#2d6a4f" }}>✓</span> {item}
                    </li>
                  ))}
                </ul>
              </div>
            ))}
          </div>
        </div>
      )}

      <div style={{ textAlign: "center", fontSize: "11px", color: "#aaa", marginTop: "20px", paddingBottom: "10px" }}>
        Generated by Claude · {new Date().toLocaleDateString("ja-JP")}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
