function CostBar({ cost, maxCost = 600 }) {
  const pct = Math.min((cost / maxCost) * 100, 100);
  const color = cost < 400 ? '#4caf50' : cost < 500 ? '#ff9800' : '#f44336';
  return (
    <div style={{ background: '#e0e0e0', borderRadius: 4, height: 8, marginTop: 4 }}>
      <div style={{ width: `${pct}%`, background: color, height: 8, borderRadius: 4, transition: 'width 0.4s' }} />
    </div>
  );
}

function MealCard({ meal, isSelected, onClick }) {
  const dayColors = {
    '\u6708': '#5b8dd9', '\u706b': '#e57373', '\u6c34': '#4db6ac',
    '\u6728': '#81c784', '\u91d1': '#ffb74d', '\u571f': '#ba68c8', '\u65e5': '#e57373'
  };
  const color = dayColors[meal.day] || '#888';
  return (
    <div
      onClick={onClick}
      style={{
        background: '#fff',
        border: isSelected ? `2px solid ${color}` : '2px solid transparent',
        borderRadius: 12,
        padding: '12px 14px',
        cursor: 'pointer',
        boxShadow: isSelected ? `0 4px 16px ${color}44` : '0 2px 8px #0001',
        transition: 'all 0.2s',
        marginBottom: 8
      }}
    >
      <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
        <div style={{ background: color, color: '#fff', borderRadius: 8, width: 42, height: 42, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
          <span style={{ fontWeight: 700, fontSize: 16 }}>{meal.day}</span>
          <span style={{ fontSize: 11 }}>{meal.date}</span>
        </div>
        <div style={{ flex: 1 }}>
          <div style={{ fontWeight: 700, fontSize: 14 }}>{meal.main}</div>
          <div style={{ fontSize: 12, color: '#888', marginTop: 2 }}>&#9201; {meal.time}&#20998; &#65295; &#165;{meal.cost}</div>
          <CostBar cost={meal.cost} />
        </div>
        <div style={{ fontSize: 18 }}>{isSelected ? '▲' : '▼'}</div>
      </div>
    </div>
  );
}

        </div>
      )}

      {tab === 'shopping' && <ShoppingTab list={weekData.shoppingList} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
