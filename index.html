<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今週の節約献立(2人分)8/10〜8/16</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --bg:#faf7f2; --card:#ffffff; --ink:#2f2a26; --sub:#7c736b;
    --accent:#e0713a; --accent-soft:#fdeee5; --line:#ece5dc;
    --green:#4f8a5b; --green-soft:#eaf4ec; --blue:#3f6f9e; --blue-soft:#e9f1f8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    line-height:1.7; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:900px; margin:0 auto; padding:20px 16px 60px;}
  header.hero{
    background:linear-gradient(135deg,#e0713a,#d4552a);
    color:#fff; border-radius:18px; padding:26px 22px; margin-bottom:20px;
    box-shadow:0 8px 24px rgba(224,113,58,.22);
  }
  .hero h1{margin:0 0 6px; font-size:24px; letter-spacing:.02em;}
  .hero .range{opacity:.92; font-size:15px; margin-bottom:16px;}
  .stats{display:flex; gap:10px; flex-wrap:wrap;}
  .stat{background:rgba(255,255,255,.18); border-radius:12px; padding:9px 14px; font-size:13px;}
  .stat b{display:block; font-size:19px; line-height:1.3;}
  .tabs{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;}
  .tab{
    border:1px solid var(--line); background:var(--card); color:var(--sub);
    padding:9px 18px; border-radius:999px; font-size:14px; cursor:pointer;
    font-family:inherit; transition:.15s;
  }
  .tab:hover{border-color:var(--accent); color:var(--accent);}
  .tab.on{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    margin-bottom:12px; overflow:hidden; transition:.15s;
  }
  .card.open{box-shadow:0 6px 20px rgba(0,0,0,.07); border-color:#dcd2c6;}
  .card-head{
    display:flex; align-items:center; gap:14px; padding:16px 18px; cursor:pointer;
    user-select:none;
  }
  .card-head:hover{background:#fdfbf8;}
  .daybadge{
    flex:0 0 46px; height:46px; border-radius:12px; background:var(--accent-soft);
    color:var(--accent); display:flex; flex-direction:column; align-items:center;
    justify-content:center; font-weight:700; font-size:15px; line-height:1.1;
  }
  .daybadge small{font-size:10px; font-weight:500; opacity:.8;}
  .head-main{flex:1; min-width:0;}
  .head-main .main{font-size:16px; font-weight:700; margin-bottom:2px;}
  .head-main .sides{font-size:12.5px; color:var(--sub);}
  .head-meta{text-align:right; flex:0 0 auto; font-size:12px; color:var(--sub);}
  .head-meta .cost{color:var(--accent); font-weight:700; font-size:15px;}
  .chev{flex:0 0 auto; color:#c3b8ab; font-size:12px; transition:transform .2s;}
  .chev.up{transform:rotate(180deg);}
  .body{border-top:1px solid var(--line); padding:18px; background:#fffdfa;}
  .grid2{display:grid; grid-template-columns:1fr 1.35fr; gap:20px;}
  @media(max-width:640px){
    .grid2{grid-template-columns:1fr; gap:16px;}
    .hero h1{font-size:20px;}
    .head-main .main{font-size:15px;}
  }
  h4.sec{
    font-size:12px; letter-spacing:.08em; color:var(--sub); margin:0 0 8px;
    text-transform:uppercase; font-weight:700;
  }
  ul.ing{list-style:none; margin:0; padding:0; font-size:13.5px;}
  ul.ing li{display:flex; justify-content:space-between; gap:10px; padding:5px 0; border-bottom:1px dashed var(--line);}
  ul.ing li span:last-child{color:var(--sub); flex:0 0 auto;}
  ol.steps{margin:0; padding-left:20px; font-size:13.5px;}
  ol.steps li{margin-bottom:8px;}
  ol.steps li::marker{color:var(--accent); font-weight:700;}
  .note{border-radius:10px; padding:11px 13px; font-size:13px; margin-top:12px;}
  .note.n{background:var(--green-soft); border-left:3px solid var(--green);}
  .note.t{background:var(--blue-soft); border-left:3px solid var(--blue);}
  .note b{display:block; font-size:11.5px; letter-spacing:.06em; margin-bottom:3px;}
  .note.n b{color:var(--green);} .note.t b{color:var(--blue);}
  .shop-cat{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px; margin-bottom:12px;}
  .shop-cat h3{margin:0 0 10px; font-size:15px; display:flex; align-items:center; gap:8px;}
  .dot{width:9px; height:9px; border-radius:50%; background:var(--accent);}
  .shop-list{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:2px 18px;}
  .shop-item{display:flex; align-items:center; gap:9px; padding:6px 0; font-size:13.5px; border-bottom:1px dashed var(--line); cursor:pointer;}
  .shop-item .qty{margin-left:auto; color:var(--sub); font-size:12.5px;}
  .shop-item.done{opacity:.42; text-decoration:line-through;}
  .box{width:17px; height:17px; border-radius:5px; border:1.5px solid #cfc4b7; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff;}
  .shop-item.done .box{background:var(--green); border-color:var(--green);}
  .total{background:var(--accent-soft); border-radius:14px; padding:16px 18px; text-align:center; margin-top:6px;}
  .total .big{font-size:26px; font-weight:800; color:var(--accent);}
  .total .cap{font-size:12.5px; color:var(--sub);}
  footer{text-align:center; color:var(--sub); font-size:12px; margin-top:28px;}
</style>
</head>

function Day({ d, open, onToggle }) {
  return (
    <div className={"card" + (open ? " open" : "")}>
      <div className="card-head" onClick={onToggle}>
        <div className="daybadge">{d.day.charAt(0)}<small>{d.date}</small></div>
        <div className="head-main">
          <div className="main">{d.main}</div>
          <div className="sides">{d.side} ／ {d.soup}</div>
        </div>
        <div className="head-meta">
          <div className="cost">約{d.cost}円</div>
          <div>{d.time}分</div>
        </div>
        <div className={"chev" + (open ? " up" : "")}>▼</div>
      </div>
      {open && (
        <div className="body">
          <div className="grid2">
            <div>
              <h4 className="sec">材料(2人分)</h4>
              <ul className="ing">
                {d.ing.map((x, i) => <li key={i}><span>{x[0]}</span><span>{x[1]}</span></li>)}
              </ul>
            </div>
            <div>
              <h4 className="sec">作り方</h4>
              <ol className="steps">
                {d.steps.map((s, i) => <li key={i}>{s}</li>)}
              </ol>
              <div className="note n"><b>栄養ポイント</b>{d.nutri}</div>
              <div className="note t"><b>調理のコツ</b>{d.tip}</div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function Shopping() {
  const [done, setDone] = useState({});
  const toggle = (k) => setDone(p => ({ ...p, [k]: !p[k] }));
  const total = MENU.reduce((a, d) => a + d.cost, 0);
  return (
    <div>
      {SHOPPING.map((c, ci) => (
        <div className="shop-cat" key={ci}>
          <h3><span className="dot"></span>{c.cat}</h3>
          <div className="shop-list">
            {c.items.map((it, ii) => {
              const k = ci + "-" + ii;
              return (
                <div className={"shop-item" + (done[k] ? " done" : "")} key={ii} onClick={() => toggle(k)}>
                  <div className="box">{done[k] ? "✓" : ""}</div>
                  <span>{it[0]}</span><span className="qty">{it[1]}</span>
                </div>
              );
            })}
          </div>
        </div>
      ))}
      <div className="total">
        <div className="big">約 {total.toLocaleString()} 円</div>
        <div className="cap">7日分・2人分の夕食合計(常備調味料・米を除く)／1食あたり約{Math.round(total / 14)}円</div>
      </div>
    </div>
  );
}

  const [tab, setTab] = useState("menu");
  const [open, setOpen] = useState(0);
  const total = MENU.reduce((a, d) => a + d.cost, 0);
  const avgTime = Math.round(MENU.reduce((a, d) => a + d.time, 0) / MENU.length);
  return (
    <div className="wrap">
      <header className="hero">
        <h1>今週の節約献立</h1>
        <div className="range">{WEEK} ・ 2人分</div>
        <div className="stats">
          <div className="stat"><b>約{total.toLocaleString()}円</b>週の食費目安</div>
          <div className="stat"><b>約{Math.round(total / 14)}円</b>1食あたり</div>
          <div className="stat"><b>{avgTime}分</b>平均調理時間</div>
          <div className="stat"><b>7日分</b>夕食メニュー</div>
        </div>
      </header>

      <div className="tabs">
        <button className={"tab" + (tab === "menu" ? " on" : "")} onClick={() => setTab("menu")}>献立カレンダー</button>
        <button className={"tab" + (tab === "shop" ? " on" : "")} onClick={() => setTab("shop")}>買い物リスト</button>
      </div>

      {tab === "menu"
        ? MENU.map((d, i) => (
            <Day key={i} d={d} open={open === i} onToggle={() => setOpen(open === i ? -1 : i)} />
          ))
        : <Shopping />}

      <footer>日付をタップすると材料・手順が開きます。買い物リストは項目をタップでチェックできます。</footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
