              <button key={day} onClick={() => { setSelectedDay(i); setShowShopping(false); setShowRecipe(false); setSelectedRecipe(0); }}
                style={{
                  border: "none", borderRadius: 14, padding: "8px 10px", fontSize: 12,
                  fontWeight: selectedDay === i ? 700 : 500,
                  background: selectedDay === i ? meals[i].color : "transparent",
                  color: selectedDay === i ? "#FFF" : "#6B6560",
                  transition: "all 0.25s ease",
                  display: "flex", flexDirection: "column", alignItems: "center", gap: 2, minWidth: 52,
                }}>
                <span style={{ fontSize: 16 }}>{DAY_EMOJI[i]}</span>
                <span>{day.replace("曜日", "")}</span>
              </button>
            ))}
          </div>

          {/* Main Card */}
          <div style={{ background: "#FFF", borderRadius: 20, boxShadow: "0 2px 20px rgba(0,0,0,0.06)", overflow: "hidden" }}>
            <div style={{ height: 6, background: `linear-gradient(90deg, ${meal.color}, ${meal.color}CC)` }} />
            <div style={{ padding: "20px 20px 16px" }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ fontSize: 24 }}>{DAY_EMOJI[selectedDay]}</span>
                  <span style={{ fontSize: 18, fontWeight: 800, color: "#2D2A26" }}>{meal.day}</span>
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  <span style={{ background: "#F0EDE8", borderRadius: 8, padding: "4px 10px", fontSize: 12, fontWeight: 600, color: "#6B6560" }}>⏱ {meal.time}</span>
                  <span style={{ background: meal.color + "20", borderRadius: 8, padding: "4px 10px", fontSize: 12, fontWeight: 600, color: meal.color }}>💰 {meal.cost}</span>
                </div>
              </div>

              <div style={{ background: `linear-gradient(135deg, ${meal.color}12, ${meal.color}08)`, borderRadius: 14, padding: 16, marginBottom: 12, borderLeft: `4px solid ${meal.color}` }}>
                <div style={{ fontSize: 10, fontWeight: 700, color: meal.color, textTransform: "uppercase", letterSpacing: 1.5, marginBottom: 6 }}>🔥 メインおかず</div>
                <div style={{ fontSize: 17, fontWeight: 800, color: "#2D2A26", marginBottom: 4 }}>{meal.main}</div>
                <div style={{ fontSize: 12, color: "#8C857B", lineHeight: 1.6 }}>{meal.mainDesc}</div>
              </div>

              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 12 }}>
                <div style={{ background: "#FAFAF8", borderRadius: 12, padding: "12px 14px" }}>
                  <div style={{ fontSize: 10, fontWeight: 700, color: "#B5AFA6", letterSpacing: 1, marginBottom: 4 }}>🥗 副菜</div>
                  <div style={{ fontSize: 13, fontWeight: 600, color: "#4A4540" }}>{meal.side}</div>
                </div>
                <div style={{ background: "#FAFAF8", borderRadius: 12, padding: "12px 14px" }}>
                  <div style={{ fontSize: 10, fontWeight: 700, color: "#B5AFA6", letterSpacing: 1, marginBottom: 4 }}>🍲 汁物</div>
                  <div style={{ fontSize: 13, fontWeight: 600, color: "#4A4540" }}>{meal.soup}</div>
                </div>
              </div>

              <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 14 }}>
                {meal.nutrition.map((n) => (
                  <span key={n} style={{ background: "#E8F5E9", color: "#4CAF50", borderRadius: 20, padding: "3px 10px", fontSize: 11, fontWeight: 600 }}>✓ {n}</span>
                ))}
              </div>

              <div style={{ background: "#FFFDE7", borderRadius: 12, padding: "10px 14px", display: "flex", gap: 8, alignItems: "flex-start" }}>
                <span style={{ fontSize: 16, flexShrink: 0 }}>💡</span>
                <span style={{ fontSize: 12, color: "#7B7263", lineHeight: 1.6, fontWeight: 500 }}>{meal.tip}</span>
              </div>
            </div>
          </div>

          {/* Recipe Button */}
          <button onClick={() => { setShowRecipe(!showRecipe); setShowShopping(false); setSelectedRecipe(0); }}
            style={{
              width: "100%", marginTop: 16, padding: "14px 20px",
              background: showRecipe ? meal.color : "#FFF",
              color: showRecipe ? "#FFF" : "#2D2A26",
              border: showRecipe ? "none" : "2px solid #E8E4DE",
              borderRadius: 16, fontSize: 14, fontWeight: 700,
              transition: "all 0.25s ease",
              display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
            }}>
            📖 作り方を見る {showRecipe ? "▲" : "▼"}
          </button>

          {/* Recipe Section */}
          {showRecipe && (
            <div style={{ background: "#FFF", borderRadius: 20, boxShadow: "0 2px 20px rgba(0,0,0,0.06)", overflow: "hidden", marginTop: 12 }}>
              <div style={{ display: "flex", borderBottom: "2px solid #F0EDE8" }}>
                {meal.recipes.map((r, i) => (
                  <button key={r.name} onClick={() => setSelectedRecipe(i)}
                    style={{
                      flex: 1, border: "none", padding: "12px 6px",
                      background: selectedRecipe === i ? `${meal.color}10` : "transparent",
                      borderBottom: selectedRecipe === i ? `3px solid ${meal.color}` : "3px solid transparent",
                      fontSize: 11, fontWeight: selectedRecipe === i ? 700 : 500,
                      color: selectedRecipe === i ? meal.color : "#8C857B",
                      transition: "all 0.2s ease", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
                    }}>
                    {r.emoji} {r.name.length > 9 ? r.name.slice(0, 9) + "…" : r.name}
                  </button>
                ))}
              </div>
              <div style={{ padding: 20 }}>
                {(() => {
                  const recipe = meal.recipes[selectedRecipe];
                  return (
                    <>
                      <h3 style={{ fontSize: 16, fontWeight: 800, color: "#2D2A26", margin: "0 0 16px", display: "flex", alignItems: "center", gap: 8 }}>
                        {recipe.emoji} {recipe.name}
                      </h3>
                      <div style={{ background: "#FAFAF8", borderRadius: 14, padding: 16, marginBottom: 16 }}>
                        <div style={{ fontSize: 11, fontWeight: 700, color: "#B5AFA6", letterSpacing: 1, marginBottom: 10, textTransform: "uppercase" }}>🧂 材料（2人分）</div>
                        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "6px 16px" }}>
                          {recipe.ingredients.map((ing, i) => (
                            <div key={i} style={{ fontSize: 12, color: "#4A4540", fontWeight: 500, padding: "2px 0", borderBottom: "1px dashed #E8E4DE" }}>{ing}</div>
                          ))}
                        </div>
                      </div>
                      <div>
                        <div style={{ fontSize: 11, fontWeight: 700, color: "#B5AFA6", letterSpacing: 1, marginBottom: 12, textTransform: "uppercase" }}>👨‍🍳 手順</div>
                        {recipe.steps.map((step, i) => (
                          <div key={i} style={{ display: "flex", gap: 12, marginBottom: 14, alignItems: "flex-start" }}>
                            <div style={{
                              width: 28, height: 28, borderRadius: "50%", flexShrink: 0,
                              background: `linear-gradient(135deg, ${meal.color}, ${meal.color}CC)`,
                              color: "#FFF", display: "flex", alignItems: "center", justifyContent: "center",
                              fontSize: 13, fontWeight: 800,
                            }}>{i + 1}</div>
                            <div style={{ fontSize: 13, color: "#4A4540", lineHeight: 1.7, fontWeight: 500, paddingTop: 4 }}>{step}</div>
                          </div>
                        ))}
                      </div>
                    </>
                  );
                })()}
              </div>
            </div>
          )}

          {/* Shopping List */}
          <button onClick={() => { setShowShopping(!showShopping); setShowRecipe(false); }}
            style={{
              width: "100%", marginTop: 12, padding: "14px 20px",
              background: showShopping ? "#2D2A26" : "#FFF",
              color: showShopping ? "#FFF" : "#2D2A26",
              border: showShopping ? "none" : "2px solid #E8E4DE",
              borderRadius: 16, fontSize: 14, fontWeight: 700,
              transition: "all 0.25s ease",
              display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
            }}>
            🛒 週間買い物リスト {showShopping ? "▲" : "▼"}
          </button>

          {showShopping && (
            <div style={{ background: "#FFF", borderRadius: 20, boxShadow: "0 2px 20px rgba(0,0,0,0.06)", padding: 20, marginTop: 12 }}>
              <h3 style={{ fontSize: 15, fontWeight: 800, color: "#2D2A26", margin: "0 0 14px" }}>📋 まとめ買いリスト（2人分）</h3>
              {[
                { cat: "🥩 肉・魚", items: ["豚バラ薄切り 150g", "鶏むね肉 1枚", "生鮭切り身 2切れ", "豚ひき肉 120g", "鶏もも肉 1枚", "牛こま切れ肉 200g", "豚ロース薄切り（しゃぶしゃぶ用）200g"], color: "#D4845A" },
                { cat: "🥬 野菜・きのこ", items: ["大根 1/2本", "キャベツ 1/2玉", "玉ねぎ 2個", "にんじん 1本", "じゃがいも 3個", "ほうれん草 1/2袋", "もやし 1/2袋", "ニラ 1/4束", "青梗菜 1株", "レタス 3枚", "トマト 1個", "きゅうり 2本", "かぼちゃ 1/6個", "長ねぎ 1本", "しめじ 1パック", "なめこ 1/2袋", "かいわれ大根 1パック", "しょうが 1片", "三つ葉 少々", "パセリ 少々"], color: "#6BAF7B" },
                { cat: "🥚 その他", items: ["卵 1パック", "木綿豆腐 1丁+1/4丁", "絹ごし豆腐 1/4丁", "油揚げ 1/2枚", "乾燥わかめ", "あおさ（乾燥）", "塩昆布 1袋", "緑豆春雨 30g", "ハム 2枚", "トマト缶 1/2缶", "コーン缶 小1缶", "梅干し", "すりごま・白ごま", "豆板醤・甜面醤", "花椒"], color: "#85CDCA" },
              ].map((section) => (
                <div key={section.cat} style={{ marginBottom: 14 }}>
                  <div style={{ fontSize: 13, fontWeight: 700, color: section.color, marginBottom: 8, paddingBottom: 4, borderBottom: `2px solid ${section.color}30` }}>{section.cat}</div>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "4px 12px" }}>
                    {section.items.map((item) => (
                            <div key={item} style={{ fontSize: 12, color: "#5A554F", padding: "3px 0", fontWeight: 500 }}>• {item}</div>
                    ))}
                  </div>
                </div>
              ))}
              <div style={{ background: "#FFF3E0", borderRadius: 10, padding: "10px 14px", marginTop: 8, fontSize: 12, color: "#E65100", fontWeight: 600, textAlign: "center" }}>
                🏪 週末にまとめ買いがおすすめ！ 合計 約3,500円〜4,000円
              </div>
            </div>
          )}

          <p style={{ textAlign: "center", fontSize: 11, color: "#C4BEB6", marginTop: 20, fontWeight: 500 }}>※ 価格は目安です。調味料・米は含みません 🍚</p>
          <p style={{ textAlign: "center", fontSize: 10, color: "#D4CFC8", marginTop: 8 }}>Generated on 2026/03/20</p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
