  .head-main .sides{font-size:12.5px; color:var(--sub);}

  .head-meta .cost{color:var(--accent); font-weight:700; font-size:15px;}
  .chev{flex:0 0 auto; color:#c3b8ab; font-size:12px; transition:transform .2s;}
  .chev.up{transform:rotate(180deg);}
  .body{border-top:1px solid var(--line); padding:18px; background:#fffdfa;}
  .grid2{display:grid; grid-template-columns:1fr 1.35fr; gap:20px;}
  @media(max-width:640px){
    .grid2{grid-template-columns:1fr; gap:16px;}
    .hero h1{font-size:20px;}
    .head-main .main{font-size:15px;}

  h4.sec{

  ol.steps li::marker{color:var(--accent); font-weight:700;}
  .note{border-radius:10px; padding:11px 13px; font-size:13px; margin-top:12px;}
  .note.n{background:var(--green-soft); border-left:3px solid var(--green);}
  .note.t{background:var(--blue-soft); border-left:3px solid var(--blue);}

  .shop-item{display:flex; align-items:center; gap:9px; padding:6px 0; font-size:13.5px; border-bottom:1px dashed var(--line); cursor:pointer;}
  .shop-item .qty{margin-left:auto; color:var(--sub); font-size:12.5px;}
  .shop-item.done{opacity:.42; text-decoration:line-through;}
  .box{width:17px; height:17px; border-radius:5px; border:1.5px solid #cfc4b7; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff;}
  .shop-item.done .box{background:var(--green); border-color:var(--green);}
  .total{background:var(--accent-soft); border-radius:14px; padding:16px 18px; text-align:center; margin-top:6px;}
  .total .big{font-size:26px; font-weight:800; color:var(--accent);}
  .total .cap{font-size:12.5px; color:var(--sub);}
  footer{text-align:center; color:var(--sub); font-size:12px; margin-top:28px;}
</style>
</head>

          <div>{d.time}分</div>
        </div>
        <div className={"chev" + (open ? " up" : "")}>▼</div>
      </div>
      {open && (
        <div className="body">
          <div className="grid2">
            <div>
              <h4 className="sec">材料(2人分)</h4>
              <ul className="ing">
                {d.ing.map((x, i) => <li key={i}><span>{x[0]}</span><span>{x[1]}</span></li>)}
              </ul>
            </div>
            <div>
              <h4 className="sec">作り方</h4>
              <ol className="steps">
                {d.steps.map((s, i) => <li key={i}>{s}</li>)}
              </ol>
              <div className="note n"><b>栄養ポイント</b>{d.nutri}</div>
              <div className="note t"><b>調理のコツ</b>{d.tip}</div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function Shopping() {
  const [done, setDone] = useState({});
  const toggle = (k) => setDone(p => ({ ...p, [k]: !p[k] }));
  const total = MENU.reduce((a, d) => a + d.cost, 0);
  return (
    <div>
      {SHOPPING.map((c, ci) => (
        <div className="shop-cat" key={ci}>
          <h3><span className="dot"></span>{c.cat}</h3>
          <div className="shop-list">
            {c.items.map((it, ii) => {
              const k = ci + "-" + ii;
              return (
                <div className={"shop-item" + (done[k] ? " done" : "")} key={ii} onClick={() => toggle(k)}>
                  <div className="box">{done[k] ? "✓" : ""}</div>
                  <span>{it[0]}</span><span className="qty">{it[1]}</span>
                </div>
              );
            })}
          </div>
        </div>
      ))}
      <div className="total">
        <div className="big">約 {total.toLocaleString()} 円</div>
        <div className="cap">7日分・2人分の夕食合計(常備調味料・米を除く)／1食あたり約{Math.round(total / 14)}円</div>
      </div>
    </div>
  );
}

function App() {
  const [tab, setTab] = useState("menu");
  const [open, setOpen] = useState(0);
  const total = MENU.reduce((a, d) => a + d.cost, 0);
  const avgTime = Math.round(MENU.reduce((a, d) => a + d.time, 0) / MENU.length);
  return (
    <div className="wrap">
      <header className="hero">
        <h1>今週の節約献立</h1>
        <div className="range">{WEEK} ・ 2人分</div>
        <div className="stats">
          <div className="stat"><b>約{total.toLocaleString()}円</b>週の食費目安</div>
          <div className="stat"><b>約{Math.round(total / 14)}円</b>1食あたり</div>
          <div className="stat"><b>{avgTime}分</b>平均調理時間</div>
          <div className="stat"><b>7日分</b>夕食メニュー</div>
        </div>
      </header>

      <div className="tabs">
        <button className={"tab" + (tab === "menu" ? " on" : "")} onClick={() => setTab("menu")}>献立カレンダー</button>
        <button className={"tab" + (tab === "shop" ? " on" : "")} onClick={() => setTab("shop")}>買い物リスト</button>
      </div>

      {tab === "menu"
        ? MENU.map((d, i) => (
            <Day key={i} d={d} open={open === i} onToggle={() => setOpen(open === i ? -1 : i)} />
          ))
        : <Shopping />}

      <footer>日付をタップすると材料・手順が開きます。買い物リストは項目をタップでチェックできます。</footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
