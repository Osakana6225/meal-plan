<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>今週の節約献立（2人分）7/6〜7/12</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif; background: #f5f3ee; color: #2e2a24; line-height: 1.7; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 20px 16px 60px; }
  header { text-align: center; padding: 28px 16px; background: linear-gradient(135deg,#5bb0e8,#4689d9); color:#fff; border-radius: 18px; margin-bottom: 22px; box-shadow:0 6px 18px rgba(70,137,217,.25); }
  header h1 { font-size: 1.6rem; letter-spacing:.02em; }
  header p { margin-top: 6px; font-size:.95rem; opacity:.95; }
  .budget { display:inline-block; margin-top:12px; background:rgba(255,255,255,.22); padding:6px 16px; border-radius:999px; font-weight:700; font-size:.95rem; }
  .tabs { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:20px; }
  .tab { border:none; background:#fff; color:#6f7a8a; padding:9px 14px; border-radius:12px; font-size:.92rem; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.06); transition:.15s; font-weight:600; }
  .tab:hover { transform:translateY(-1px); }
  .tab.active { background:#4689d9; color:#fff; }
  .card { background:#fff; border-radius:18px; padding:22px; box-shadow:0 4px 16px rgba(0,0,0,.07); }
  .day-head { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; border-bottom:2px dashed #cee3f2; padding-bottom:12px; margin-bottom:16px; }
  .day-head h2 { font-size:1.35rem; color:#4689d9; }
  .day-head .date { color:#99a; font-size:.95rem; }
  .meta { margin-left:auto; display:flex; gap:8px; }
  .pill { background:#eef3f8; color:#62748a; padding:4px 12px; border-radius:999px; font-size:.82rem; font-weight:700; }
  .menu-row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px; }
  .menu-item { background:#f2f7fb; border-radius:12px; padding:12px; text-align:center; }
  .menu-item .label { font-size:.72rem; color:#8ca4bc; font-weight:700; letter-spacing:.08em; }
  .menu-item .name { font-size:.98rem; font-weight:700; margin-top:4px; }
  .desc { background:#f0f7fd; border-left:4px solid #5bb0e8; padding:10px 14px; border-radius:8px; font-size:.92rem; color:#4a5c6b; margin-bottom:18px; }
  .sec { margin-bottom:16px; }
  .sec h3 { font-size:.98rem; color:#2f7cc2; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
  .ing { display:grid; grid-template-columns:repeat(2,1fr); gap:4px 18px; }
  .ing div { font-size:.9rem; border-bottom:1px dotted #eee; padding:3px 0; }
  ol.steps { padding-left:20px; }
  ol.steps li { font-size:.92rem; margin-bottom:6px; }
  .twocol { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .note { border-radius:10px; padding:12px 14px; font-size:.88rem; }
  .nutri { background:#eef6ec; border-left:4px solid #6fae5d; color:#456b3a; }
  .tip { background:#fef6e3; border-left:4px solid #e0a93c; color:#8a6a1f; }
  .shop .card { padding:22px; }
  .shop-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
  .shop-cat h4 { color:#2f7cc2; font-size:1rem; margin-bottom:8px; border-bottom:2px solid #d9e8f4; padding-bottom:4px; }
  .shop-cat ul { list-style:none; }
  .shop-cat li { font-size:.9rem; padding:4px 0; border-bottom:1px dotted #eee; display:flex; justify-content:space-between; }
  .shop-cat li span { color:#99a; }
  footer { text-align:center; margin-top:26px; color:#8ca4bc; font-size:.82rem; }
  @media (max-width:600px){ .menu-row{grid-template-columns:1fr;} .ing{grid-template-columns:1fr;} .twocol{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;

const days = [
  {
    day:"月曜日", date:"7/6",
    main:"麻婆なす", sub:"もやしとにんじんのごま酢和え", soup:"卵とわかめの中華スープ",
    time:"25分", cost:"約420円",
    mainDesc:"特売のなすと豚ひき肉でボリューム満点。ピリ辛の甘辛だれでごはんが進む中華おかず",
    ing:["豚ひき肉 150g","なす 3本","長ねぎ 1/2本","おろしにんにく・しょうが 各小さじ1","豆板醤 小さじ1/2","味噌・醤油・砂糖 各大さじ1","水 100ml","片栗粉 小さじ1","【副菜】もやし 1袋","にんじん 1/3本","酢・ごま油・砂糖 各小さじ1","【汁】乾燥わかめ 大さじ1","卵 1個","鶏がらスープの素 小さじ1"],
    steps:["なすは乱切りにして水にさらし、油で炒めて一度取り出す","ひき肉とにんにく・しょうが・豆板醤を炒め、合わせ調味料を加える","なすを戻し入れ、水溶き片栗粉でとろみをつける","もやしとにんじんをゆでてごま酢で和え、わかめと卵のスープを添える"],
    nutri:"なすのポリフェノールと豚肉のビタミンB1。夏バテ予防にぴったりの一皿",
    tip:"なすは炒める前に油をからめておくと、少ない油でもトロッと仕上がります"
  },
  {
    day:"火曜日", date:"7/7",
    main:"七夕そうめん（鶏そぼろ・錦糸卵のせ）", sub:"オクラとトマトの和え物", soup:"コーンスープ",
    time:"25分", cost:"約400円",
    mainDesc:"七夕にぴったりの彩りそうめん。鶏そぼろと錦糸卵、星形オクラで食卓を華やかに",
    ing:["そうめん 3束","鶏ひき肉 150g","卵 2個","めんつゆ 適量","醤油・砂糖・みりん 各大さじ1","【副菜】オクラ 4本","ミニトマト 6個","ポン酢 適量","【汁】コーン缶 1/2缶","牛乳 100ml","コンソメ 小さじ1"],
    steps:["鶏ひき肉を醤油・砂糖・みりんで炒りそぼろにする","薄焼き卵を作って細切りにし錦糸卵にする","そうめんをゆでて冷水でしめ、具をのせめんつゆでいただく","輪切りオクラとトマトをポン酢で和え、コーンスープを添える"],
    nutri:"鶏そぼろと卵のたんぱく質、夏野菜のビタミンで暑い日も食欲アップ",
    tip:"オクラは輪切りにすると星形に。七夕らしい彩りが楽しめます"
  },
  {
    day:"水曜日", date:"7/8",
    main:"豚こまと夏野菜の甘酢炒め", sub:"冷奴 みょうがのせ", soup:"なすとみょうがの味噌汁",
    time:"20分", cost:"約430円",
    mainDesc:"夏野菜と豚こまを甘酢でさっぱり。暑い日でも食べやすい彩り炒め",
    ing:["豚こま切れ肉 200g","ピーマン 2個","パプリカ 1/2個","玉ねぎ 1/2個","酢・砂糖・醤油 各大さじ1","ケチャップ 大さじ1","片栗粉 適量","【副菜】絹豆腐 1丁","みょうが・かつお節 適量","【汁】なす 1本","みょうが 1個","だし・味噌 適量"],
    steps:["豚こまに片栗粉をまぶし、野菜を食べやすく切る","フライパンで豚肉を焼き、野菜を加えて炒める","合わせた甘酢だれを回し入れて炒め絡める","冷奴にみょうがをのせ、なすの味噌汁を添える"],
    nutri:"カラフルな夏野菜でビタミンA・C、豚肉のたんぱく質で夏の体力を維持",
    tip:"甘酢だれは先に混ぜておくと、手早く炒めて野菜のシャキ感が残ります"
  },
  {
    day:"木曜日", date:"7/9",
    main:"あじの南蛮漬け", sub:"きゅうりとわかめの酢の物", soup:"豆腐とねぎのすまし汁",
    time:"30分", cost:"約450円",
    mainDesc:"旬で安いあじを揚げ焼きにして南蛮酢に。作り置きもできるさっぱり和惣菜",
    ing:["あじ（三枚おろし）4枚","玉ねぎ 1/2個","にんじん 1/3本","酢 大さじ3","砂糖・醤油 各大さじ2","水 大さじ2","小麦粉 適量","【副菜】きゅうり 1本","乾燥わかめ 大さじ1","酢・砂糖 各小さじ2","【汁】絹豆腐 1/2丁","長ねぎ 少々","だし汁 400ml"],
    steps:["あじに小麦粉をまぶし、少なめの油で揚げ焼きにする","薄切り玉ねぎ・にんじんと南蛮酢を合わせる","熱いうちにあじを漬け込み15分以上なじませる","きゅうりとわかめの酢の物、豆腐のすまし汁を添える"],
    nutri:"あじのDHA・EPAとカルシウム。酢の効果で疲労回復もサポート",
    tip:"揚げたてを熱い南蛮酢に漬けると、味がよく染みてやわらかくなります"
  },
  {
    day:"金曜日", date:"7/10",
    main:"回鍋肉（ホイコーロー）", sub:"春雨ときゅうりの中華サラダ", soup:"トマトと卵のスープ",
    time:"20分", cost:"約440円",
    mainDesc:"キャベツと豚こまでボリューム満点。甘辛味噌だれでごはんが進む中華の定番",
    ing:["豚こま切れ肉 200g","キャベツ 1/4個","ピーマン 2個","長ねぎ 1/4本","味噌・醤油・砂糖 各大さじ1","豆板醤 小さじ1/2","おろしにんにく 少々","【副菜】春雨 40g","きゅうり 1本","ハム 2枚","醤油・酢・ごま油 適量","【汁】トマト 1個","卵 1個","鶏がらスープの素 小さじ1"],
    steps:["キャベツはざく切り、ピーマンは乱切りにする","豚こまを炒め、キャベツとピーマンを加える","合わせ味噌だれを回し入れて手早く炒める","春雨サラダを作り、トマトと卵のスープを添える"],
    nutri:"キャベツのビタミンUで胃を守り、豚肉のたんぱく質でスタミナ補給",
    tip:"キャベツは大きめに切り、強火で手早く炒めるとシャキッと仕上がります"
  },
  {
    day:"土曜日", date:"7/11",
    main:"豆腐ハンバーグ和風あんかけ", sub:"マカロニサラダ", soup:"オニオンコンソメスープ",
    time:"35分", cost:"約480円",
    mainDesc:"豆腐でかさ増ししてふんわりヘルシー。大根おろしと和風あんでさっぱり食べられる",
    ing:["合いびき肉 200g","木綿豆腐 1/2丁","玉ねぎ 1/2個","パン粉 大さじ3","卵 1個","大根おろし 適量","醤油・みりん・だし 各大さじ1","片栗粉 小さじ1","【副菜】マカロニ 60g","きゅうり・にんじん・マヨネーズ 適量","【汁】玉ねぎ 1/2個","コンソメ 小さじ1"],
    steps:["水切り豆腐・ひき肉・炒め玉ねぎ・パン粉・卵をよく練り混ぜる","小判形に成形し、フライパンで両面をじっくり焼く","醤油・みりん・だしを煮て水溶き片栗粉であんを作る","大根おろしとあんをかけ、マカロニサラダとスープを添える"],
    nutri:"豆腐で脂質を抑えつつ大豆イソフラボン。ひき肉とあわせて良質たんぱく",
    tip:"豆腐はしっかり水切りすると、焼くときに崩れずふんわり仕上がります"
  },
  {
    day:"日曜日", date:"7/12",
    main:"ゴーヤチャンプルー", sub:"切り干し大根の煮物", soup:"もずくスープ",
    time:"25分", cost:"約440円",
    mainDesc:"夏の定番沖縄料理。ゴーヤと豆腐・卵・豚肉で栄養満点、暑い日のスタミナ補給に",
    ing:["ゴーヤ 1本","木綿豆腐 1/2丁","豚こま切れ肉 150g","卵 2個","かつお節 適量","醤油・鶏がらの素 各小さじ1","塩こしょう 少々","【副菜】切り干し大根 20g","にんじん・油揚げ 適量","醤油・みりん 各大さじ1","【汁】もずく 1パック","鶏がらスープの素 小さじ1"],
    steps:["ゴーヤは薄切りにして塩もみし苦みを抜く","豆腐を焼いて取り出し、豚肉とゴーヤを炒める","豆腐を戻し、溶き卵を回し入れて調味しかつお節を振る","切り干し大根の煮物ともずくスープを添える"],
    nutri:"ゴーヤのビタミンCと豆腐・卵・豚肉のたんぱく質で夏バテ知らず",
    tip:"ゴーヤは塩もみ後さっと下ゆですると、苦みが和らいで食べやすくなります"
  }
];

const shopping = {
  "肉・魚":[["豚こま切れ肉","約550g"],["豚ひき肉","150g"],["鶏ひき肉","150g"],["合いびき肉","200g"],["あじ(三枚おろし)","4枚"],["ハム","2枚"]],
  "野菜":[["なす","4本"],["もやし","1袋"],["にんじん","1本"],["長ねぎ","1本"],["玉ねぎ","2個"],["ピーマン","4個"],["パプリカ","1/2個"],["キャベツ","1/4個"],["ゴーヤ","1本"],["きゅうり","3本"],["オクラ","4本"],["ミニトマト・トマト","計7個"],["みょうが","2個"],["大根","1/4本"]],
  "豆腐・大豆製品":[["絹豆腐","1.5丁"],["木綿豆腐","1丁"],["油揚げ","少量"]],
  "卵・乳":[["卵","8個"],["牛乳","少量"]],
  "缶詰・乾物":[["コーン缶","1缶"],["乾燥わかめ","少量"],["切り干し大根","20g"],["春雨","40g"],["もずく","1パック"],["そうめん","3束"],["マカロニ・パン粉","各少量"]],
  "調味料・その他":[["豆板醤・甜麺醤","少量"],["めんつゆ・ポン酢","各少量"],["酢・ケチャップ","少量"],["味噌・醤油・みりん","常備"],["ごはん用米","適量"]]
};

function Card({d}){
  return (
    <div className="card">
      <div className="day-head">
        <h2>{d.day}</h2><span className="date">{d.date}</span>
        <div className="meta"><span className="pill">⏱ {d.time}</span><span className="pill">💰 {d.cost}</span></div>
      </div>
      <div className="menu-row">
        <div className="menu-item"><div className="label">メイン</div><div className="name">{d.main}</div></div>
        <div className="menu-item"><div className="label">副菜</div><div className="name">{d.sub}</div></div>
        <div className="menu-item"><div className="label">汁物</div><div className="name">{d.soup}</div></div>
      </div>
      <div className="desc">{d.mainDesc}</div>
      <div className="sec"><h3>🛒 材料（2人分）</h3>
        <div className="ing">{d.ing.map((x,i)=><div key={i}>{x}</div>)}</div>
      </div>
      <div className="sec"><h3>👩‍🍳 作り方</h3>
        <ol className="steps">{d.steps.map((x,i)=><li key={i}>{x}</li>)}</ol>
      </div>
      <div className="twocol">
        <div className="note nutri"><strong>🥗 栄養ポイント</strong><br/>{d.nutri}</div>
        <div className="note tip"><strong>💡 コツ</strong><br/>{d.tip}</div>
      </div>
    </div>
  );
}

function App(){
  const [tab,setTab] = useState(0);
  return (
    <div className="wrap">
      <header>
        <h1>今週の節約献立 🍚</h1>
        <p>2人分・夕食 ／ 7月6日(月)〜7月12日(日)</p>
        <div className="budget">週合計 約3,300円（買い物リスト目安）</div>
      </header>
      <div className="tabs">
        {days.map((d,i)=>(
          <button key={i} className={"tab"+(tab===i?" active":"")} onClick={()=>setTab(i)}>{d.day.slice(0,1)}<small> {d.date}</small></button>
        ))}
        <button className={"tab"+(tab===7?" active":"")} onClick={()=>setTab(7)}>🛒 買い物</button>
      </div>
      {tab<7 ? <Card d={days[tab]} /> : (
        <div className="shop card">
          <div className="day-head"><h2>買い物リスト</h2><span className="date">1週間分・2人</span></div>
          <div className="shop-grid">
            {Object.entries(shopping).map(([cat,items])=>(
              <div className="shop-cat" key={cat}>
                <h4>{cat}</h4>
                <ul>{items.map((it,i)=><li key={i}>{it[0]}<span>{it[1]}</span></li>)}</ul>
              </div>
            ))}
          </div>
        </div>
      )}
      <footer>節約重視・週合計 約3,000〜3,500円目安 ／ 毎週日曜に自動更新</footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
